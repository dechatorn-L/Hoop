<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏀 Hoop Shot Counter — AI Basketball Shot Tracker</title>
  <meta name="description" content="Real-time basketball shot counter web application powered by Roboflow object detection and Web Audio API" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/index.css" />
</head>
<body>
  <div id="app">
    <!-- Header with All Controls -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <div class="brand" id="brand-logo">
          <span class="brand-icon">🏀</span>
          <h1 class="brand-title">Hoop Counter</h1>
        </div>
      </div>

      <div class="header-center" id="header-camera-controls">
        <div class="control-group" id="camera-control-group">
          <label for="camera-select" class="visually-hidden">เลือกกล้อง</label>
          <select id="camera-select" class="select-input select-header">
            <option value="">📷 กำลังค้นหากล้อง...</option>
          </select>
        </div>
        <button id="btn-reset-score" class="btn btn-secondary btn-header">🔄 Reset</button>
      </div>

      <div class="header-right header-controls" id="header-controls">
        <div class="score-badge" id="score-display">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score-value">0</span>
        </div>
        <button id="btn-fullscreen-toggle" class="btn-icon" aria-label="Toggle Fullscreen" title="เต็มจอ (Fullscreen)">⛶</button>
        <button id="btn-settings-toggle" class="btn-icon" aria-label="Open settings" title="การตั้งค่า">⚙️</button>
      </div>
    </header>

    <!-- Main Viewport (Maximized Camera Feed + Canvas Overlay) -->
    <main class="viewport-container viewport-maximized" id="main-viewport">
      <div class="camera-container camera-container-max" id="camera-container">
        <video id="camera-feed" playsinline autoplay muted></video>
        <canvas id="detection-overlay"></canvas>
        <div id="status-indicator" class="status-overlay hidden">
          <div class="spinner" id="status-spinner"></div>
          <span id="status-text">กำลังโหลดโมเดล...</span>
        </div>
      </div>
    </main>

    <!-- Slide-in Settings Panel -->
    <aside id="settings-panel" class="settings-drawer hidden" aria-label="Settings Panel">
      <div class="settings-header" id="settings-header">
        <h2>⚙️ Settings</h2>
        <button id="btn-close-settings" class="btn-icon" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-content" id="settings-content">
        <!-- Sound Effect Section -->
        <section class="settings-section" id="section-sound">
          <h3>🔊 Sound Effect</h3>
          <div class="radio-group" id="sound-options">
            <label class="radio-label">
              <input type="radio" name="sound-choice" id="sound-radio-chaching" value="cha-ching" checked />
              <span>Cha-Ching 💰</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="sound-choice" id="sound-radio-fahhhh" value="fahhhh" />
              <span>Fahhhh 💨</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="sound-choice" id="sound-radio-greengiant" value="green-giant" />
              <span>Green Giant 🎅</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="sound-choice" id="sound-radio-custom" value="custom" />
              <span>Custom Upload 📁</span>
            </label>
          </div>
          <div id="custom-sound-upload-container" class="custom-upload-container hidden">
            <input type="file" id="custom-sound-file" accept="audio/*" aria-label="Upload custom sound" />
          </div>
          <div class="test-sound-wrap" style="margin-top: 10px;">
            <button type="button" id="btn-test-sound" class="btn-ctrl" style="width: 100%; justify-content: center; font-size: 0.85rem; padding: 6px 12px;">
              ▶️ ทดสอบเล่นเสียง (Test Sound)
            </button>
          </div>
        </section>

        <!-- Volume Section -->
        <section class="settings-section" id="section-volume">
          <label for="volume-slider">🔉 Volume: <span id="volume-label" class="val-badge">80%</span></label>
          <input type="range" id="volume-slider" min="0" max="100" value="80" class="range-slider" />
        </section>

        <!-- Sensitivity / Threshold Section -->
        <section class="settings-section" id="section-sensitivity">
          <label for="confidence-slider">🎯 Sensitivity (Threshold): <span id="confidence-label" class="val-badge">35%</span></label>
          <input type="range" id="confidence-slider" min="10" max="90" value="35" class="range-slider" />
        </section>
      </div>
    </aside>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
