<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ONNX Real Benchmark</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.min.js"></script>
  <style>
    body { font-family: monospace; background: #111; color: #00ff88; padding: 20px; }
    pre { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; color: #fff; }
  </style>
</head>
<body>
  <h2>🔬 Real In-Browser Inference Benchmark: Swish-Vision (11.7 MB)</h2>
  <div id="status">Starting benchmark...</div>
  <pre id="results">Running...</pre>

  <script>
    async function runBenchmark() {
      const resultsEl = document.getElementById('results');
      const statusEl = document.getElementById('status');
      
      const modelPath = '/models/basketball_swish_yolov8.onnx';
      const iterations = 30;
      const warmup = 5;

      const log = (msg) => {
        resultsEl.textContent += msg + '\n';
        console.log(msg);
      };

      resultsEl.textContent = '';

      async function testConfig(numThreads, inputDim = 640) {
        log(`\n========================================`);
        log(`🧪 Testing: ${numThreads} Thread(s) | Input: ${inputDim}x${inputDim}`);
        log(`========================================`);

        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/';
        ort.env.wasm.numThreads = numThreads;
        ort.env.wasm.simd = true;

        statusEl.textContent = `Loading model with ${numThreads} thread(s)...`;
        const session = await ort.InferenceSession.create(modelPath, {
          executionProviders: ['wasm'],
          graphOptimizationLevel: 'all',
        });

        // Create dummy tensor [1, 3, inputDim, inputDim]
        const floatData = new Float32Array(1 * 3 * inputDim * inputDim);
        floatData.fill(0.5);
        const inputTensor = new ort.Tensor('float32', floatData, [1, 3, inputDim, inputDim]);
        const feeds = { [session.inputNames[0]]: inputTensor };

        log(`🔥 Warming up (${warmup} iterations)...`);
        for (let i = 0; i < warmup; i++) {
          await session.run(feeds);
        }

        log(`⏱️ Benchmarking (${iterations} real iterations)...`);
        const times = [];
        for (let i = 0; i < iterations; i++) {
          const t0 = performance.now();
          await session.run(feeds);
          const t1 = performance.now();
          times.push(t1 - t0);
        }

        const avg = times.reduce((a, b) => a + b, 0) / times.length;
        const min = Math.min(...times);
        const max = Math.max(...times);
        const p95 = times.slice().sort((a, b) => a - b)[Math.floor(times.length * 0.95)];
        const fps = 1000 / avg;

        log(`  📊 Average Latency: ${avg.toFixed(2)} ms`);
        log(`  ⚡ Estimated FPS  : ${fps.toFixed(1)} FPS`);
        log(`  🟢 Min Latency    : ${min.toFixed(2)} ms`);
        log(`  🔴 Max Latency    : ${max.toFixed(2)} ms`);
        log(`  📈 95th Percentile: ${p95.toFixed(2)} ms`);

        return { numThreads, inputDim, avg, fps, min, max, p95 };
      }

      try {
        const res1 = await testConfig(1, 640);
        const res2 = await testConfig(2, 640);
        const resRoi = await testConfig(2, 416);

        log(`\n========================================`);
        log(`🏆 FINAL COMPARISON SUMMARY`);
        log(`========================================`);
        log(`1 Thread  (640x640 Full)  : ${res1.avg.toFixed(2)} ms (${res1.fps.toFixed(1)} FPS)`);
        log(`2 Threads (640x640 Full)  : ${res2.avg.toFixed(2)} ms (${res2.fps.toFixed(1)} FPS) -> Speedup: ${(res1.avg / res2.avg).toFixed(2)}x Faster`);
        log(`2 Threads (416x416 Turbo) : ${resRoi.avg.toFixed(2)} ms (${resRoi.fps.toFixed(1)} FPS) -> Speedup: ${(res1.avg / resRoi.avg).toFixed(2)}x Faster!`);

        statusEl.textContent = '✅ Benchmark Complete!';
        window.BENCHMARK_DONE = { res1, res2, resRoi };
      } catch (err) {
        log(`❌ Benchmark Error: ${err.message}`);
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', runBenchmark);
  </script>
</body>
</html>
